# zram (priority 100) is the primary swap, with a disk swapfile as overflow at priority 10.
# Prefer compressing anonymous pages over evicting file-backed (incl. executable) pages.
vm.swappiness=180
# No swap readahead. Right for zram, which is RAM-backed and has no seek cost. It applies
# to the swapfile too, where it means faulting back from NVMe 4 KiB at a time - revisit if
# the swapfile ever takes real traffic, but not blind: raising it trades against zram,
# which still handles the bulk.
vm.page-cluster=0
