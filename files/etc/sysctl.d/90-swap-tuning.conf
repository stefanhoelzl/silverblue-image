# The disk swapfile is the only swap device, with zswap as a compressed cache in front of it
# (files/usr/lib/tmpfiles.d/zswap.conf). Swap-out lands in compressed RAM first; only pages
# that go cold, or compress badly, reach the disk.
#
# Prefer swapping anonymous pages over evicting file-backed (incl. executable) pages. Set for
# zram, where swap-out was only compression, and kept for zswap: the reason was gnome-shell
# freezing when its code pages were evicted, and that still applies. Worth lowering toward
# 100 if swap-ins from disk turn out to dominate (pswpin in /proc/vmstat vs zswpin).
vm.swappiness=180
# No swap readahead. A page still in the zswap pool is decompressed on its own, so reading
# ahead would decompress neighbours nobody asked for; for pages already on NVMe the seek
# cost that readahead saves is negligible.
vm.page-cluster=0
