# Full copy of the uresourced package default, with only the two MemoryMin values changed
# (250M -> 1G). Shipped whole rather than patched in the build because everything else here
# — MaxMemoryMin, the IO/CPU weights, the AppBoost weights — is live configuration that a
# two-section file would silently drop. Diff against the package's own copy to see the
# change: `podman run --rm quay.io/fedora/fedora-silverblue:latest cat /etc/uresourced.conf`.
#
# Why 1G: gnome-shell's working set is ~283 MB, above the 250M default, so under pressure
# the shell's own executable pages get reclaimed and it major-faults back in — that is the
# desktop freeze. MaxMemoryMin=10% below caps this at ~3.1 GB on a 30 GiB machine and
# session.slice currently totals 476 MB, so 1G is comfortably affordable.
#
# Both sections are needed. In cgroup v2 a child's effective memory.min is clamped by its
# parent's, so [ActiveUser] (user.slice / user-1000.slice / user@1000.service) raises the
# ceiling and [SessionSlice] (session.slice) is where the protection actually lands.
# Setting only [SessionSlice] does not work — the parent cap clamps it back. [SessionSlice]
# defaults to the [ActiveUser] value and so is technically redundant, but it is spelled out
# because the two serve different roles.

[Global]
# Protect at maximum 10% of available memory. user.slice system will get a
# MemoryLow allocation of
#   min(ActiveUser.MemoryLow * active_users, MaxMemoryLow)
MaxMemoryMin=10%
#MaxMemoryLow=0


[ActiveUser]
# This creates a memory allocation for the active user.
MemoryMin=1G
#MemoryLow=0M
IOWeight=500
CPUWeight=500

[SessionSlice]
# The following values default to the ones from ActiveUser. By default, this
# creates a session.slice drop-in configuration with the exact same settings
# as ActiveUser has.
# i.e. delegate all the memory to session critical applications and boost them
# in the same relation as an active user is boosted compared to inactive ones.
MemoryMin=1G
#MemoryLow=0M
#
#IOWeight=500
#CPUWeight=500

[AppBoost]
# The following values are used for resource management of user applications.
# The range for all weights are [1,10000]
# Default weights apply to an application when it is not active,
# I.e. the window is not focused. Default value for CPU is 100, IO is 100
#DefaultCPUWeight=100
#DefaultIOWeight=100
# Active weights apply when the window is focused, this is when
# user is actively interacting with the application/window.
# If these weights are not set they default to 100 for CPU and 100 for IO,
# therefore making no difference irrespective of application state.
ActiveCPUWeight=300
ActiveIOWeight=300
# Boost weights act like increments to the active or default weights
# mentioned previously, these apply to special use-cases like when 
# an application is playing audio or for a game(detected through GameMode).
# If these are not set they default to 0 for CPU and 0 for IO (No Boost).
BoostCPUWeightInc=200
BoostIOWeightInc=200
