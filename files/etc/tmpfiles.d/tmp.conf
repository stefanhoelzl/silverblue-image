# Shortens /tmp's retention from systemd's 10d default to 3d. /var/tmp keeps the stock 30d
# and is repeated because the override replaces the package file wholesale, not line by line.
#
# In /etc, not /usr/lib: tmpfiles.d overrides work by basename, so a file named tmp.conf in
# /usr/lib/tmpfiles.d would collide with systemd's own copy of that name rather than replace
# it. /etc is the sanctioned place to shadow it. (uresourced-system-control.conf next to it
# in /usr/lib/tmpfiles.d has a unique name and needs no such treatment.)
q /tmp     1777 root root 3d
q /var/tmp 1777 root root 30d
