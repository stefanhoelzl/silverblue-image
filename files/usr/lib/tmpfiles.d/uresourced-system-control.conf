# uresourced applies its per-user MemoryMin/MemoryLow/CPUWeight/IOWeight through the systemd
# D-Bus call SetUnitProperties with runtime=false, so PID 1 writes the resulting drop-ins to
# /etc/systemd/system.control/ instead of /run/systemd/system.control/. Upstream does not
# appear to intend that - uresourced.service carries
#
#     ProtectSystem=strict
#     # The daemon writes drop-in configurations for the user systemd instance
#     ReadWritePaths=/run/systemd
#
# but that sandbox never applies, because the daemon does not write the files; PID 1 does.
# uresourced 0.5.4 offers no setting to change it.
#
# The result is four permanent files per uid that has ever had a login session, and they
# survive every rebase through the ostree /etc merge. On the machine this was found on that
# was 39 unit directories and 193 files, most of them container-mapped uids in the 60578+
# range that no longer exist - pure noise in `ostree admin config-diff`, and it only grows.
#
# Clearing them at boot is safe: uresourced re-applies the properties as soon as a session
# becomes active, and no user slice exists yet this early in sysinit.target. What remains is
# only the uids seen since the last boot.
#
# Scoped to the three unit patterns uresourced touches rather than the whole directory, so
# that an admin's own persistent `systemctl set-property` drop-ins for other units survive.
# Remove this file if uresourced ever switches to runtime=true.
R! /etc/systemd/system.control/user.slice.d
R! /etc/systemd/system.control/user-*.slice.d
R! /etc/systemd/system.control/user@*.service.d
