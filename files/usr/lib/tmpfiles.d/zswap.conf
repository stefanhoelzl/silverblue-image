# Turn on zswap: a compressed cache in RAM in front of the disk swapfile, replacing zram
# (switched off by files/etc/systemd/zram-generator.conf).
#
# Why zswap and not zram plus the swapfile: the kernel never moves pages between swap
# devices, so zram fills once with whatever was swapped out first and every later swap-out
# goes to disk - the coldest pages hold the fast tier. zswap instead evicts its oldest
# entries to the swapfile slots already reserved for them, so compressed RAM keeps the
# recently swapped pages, and pages that do not compress are written straight to disk.
# Measured before the switch: zram full at 8 GiB, costing 4.8 GiB of RAM (lzo-rle, 1.7:1),
# with 11 GiB already on the swapfile.
#
# Set through sysfs rather than zswap.* kernel arguments so it ships as a plain file with
# no kargs handling. The Fedora kernel builds zswap in but leaves it off, with lzo as the
# compressor; zstd compresses markedly better on desktop memory and is autoloaded as a
# module on the write. The rest stays at the kernel defaults: max_pool_percent=20 (~6 GiB
# here) and shrinker_enabled=Y, which writes cold entries out under memory pressure rather
# than only once the pool is full.
#
# Without the swapfile (make-swapfile skipped the machine, or its first boot before the
# file exists) zswap has no device to sit in front of and does nothing.
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/enabled    - - - - Y
