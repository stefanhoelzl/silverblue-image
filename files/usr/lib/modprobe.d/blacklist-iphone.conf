# Keep the kernel from claiming a connected iPhone. Without this, plugging one in binds it
# to the USB ethernet/MBIM gadget drivers and the MFi fast-charge driver, which take the
# interfaces libimobiledevice needs; the 39-apple-recovery.rules rule alongside this file
# opens the raw USB device for the same reason.
#
# blacklist only suppresses autoloading by modalias - `modprobe ipheth` still works, so USB
# tethering stays one command away rather than gone.
blacklist apple_mfi_fastcharge
blacklist ipheth
blacklist cdc_ncm
blacklist cdc_ether
blacklist cdc_mbim
