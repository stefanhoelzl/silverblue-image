# gnome-shell links GLib, and GIO resolves its proxy resolver and network monitor to the
# *portal* implementations whenever it believes it is sandboxed. Those call
# org.freedesktop.portal.Desktop, so if the portal is slow or wedged the shell blocks on the
# 25 s D-Bus default timeout during init. The machine this came from recorded the chain as
# gnome-shell -> libsoup -> GIO proxy resolver -> portal -> hang/SIGABRT.
#
# Scoped to this unit rather than environment.d, where these pins lived from April until
# they were dropped. The session environment is inherited by Flatpak sandboxes, and there
# the portal backends are the correct choice - the pinned ones cannot reach the system bus.
# The drop-in is on the template, so it covers both @wayland and @x11.
#
# Both values were checked against this image's GLib: "gnome" is the extension name
# advertised by libgiognomeproxy.so, and "netlink" is built into libgio as
# GNetworkMonitorNetlink. An unknown name here does not fail loudly - GLib warns and falls
# back to the portal implementation, which is how GIO_USE_PROXY_RESOLVER=dconf managed to do
# nothing at all for months in the portal's own drop-in.
#
# Only these two are pinned, matching what was actually in service. The portal's drop-in
# additionally pins the memory and power-profile monitors because inside the portal binary
# those are a self-call; from gnome-shell they are an ordinary cross-process call, and there
# is no evidence either ever hung.
#
# This may now be redundant: xdg-desktop-portal.service.d/gio-no-portal-selfcall.conf stops
# the portal from wedging itself, which was what left the shell blocking on it. Kept as a
# second line of defence - drop it once some boots confirm the portal comes up clean.
[Service]
Environment=GIO_USE_PROXY_RESOLVER=gnome
Environment=GIO_USE_NETWORK_MONITOR=netlink
