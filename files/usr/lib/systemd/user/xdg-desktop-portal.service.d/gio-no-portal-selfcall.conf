# xdg-desktop-portal links GLib, and GIO picks the *portal* implementation of its memory
# monitor, power-profile monitor, network monitor and proxy resolver whenever it believes
# it is sandboxed. Inside the portal binary that is a self-call: the D-Bus request to
# org.freedesktop.portal.Desktop asks systemd to start the very service that is still
# starting, so the name never appears and each subsystem burns the 25 s D-Bus default
# timeout. Together they pass TimeoutStartSec=45s, the unit fails, and GDM reports
# "Session never registered" - login bounces back to the greeter.
#
# Pinning to the non-portal implementations breaks the cycle. Each value below was checked
# against this image's GLib and yields the non-portal type even with GIO_USE_PORTALS set.
# GIO_USE_PROXY_RESOLVER in particular must be "gnome": "dconf" is not a GIO module name,
# and GLib answers an unknown name by warning ("Can't find module 'dconf' specified in
# GIO_USE_PROXY_RESOLVER") and falling back to the portal resolver - the opposite of the
# intent, and invisible unless you read the journal.
#
# Scoped to this unit on purpose. The same pins in environment.d would cover the whole
# session, and Flatpak passes the session environment into its sandboxes - where the
# portal backends are the right choice and the pinned ones cannot reach the system bus.
# Only the portal itself must never self-call.
#
# GIO_USE_VFS is deliberately absent: pinning it would break gvfs mounts in Files.
#
# Revert when GLib learns it is running inside the portal, or when xdg-desktop-portal sets
# these itself. The symptom to watch for is a login bounce alongside "Failed to initialize
# portal (GMemoryMonitorPortal) for gio-memory-monitor: ... StartServiceByName for
# org.freedesktop.portal.Desktop: Timeout was reached".
[Service]
Environment=GIO_USE_MEMORY_MONITOR=dbus
Environment=GIO_USE_POWER_PROFILE_MONITOR=dbus
Environment=GIO_USE_NETWORK_MONITOR=netlink
Environment=GIO_USE_PROXY_RESOLVER=gnome
